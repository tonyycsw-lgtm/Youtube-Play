<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>播放中</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-player">
  <header class="site-header player-header">
    <div class="container player-header-inner">
      <div class="player-header-main">
        <a class="back-link" href="index.html" id="btn-back">← 節目清單</a>
        <div class="player-title-block">
          <h1 id="page-title">載入中…</h1>
          <p id="page-desc" class="player-desc"></p>
        </div>
      </div>
    </div>
  </header>

  <main class="container player-shell">
   <div class="player-layout">
    <div class="player-main">
    <div class="video-wrap" id="video-wrap">
      <div id="player"></div>
      <div id="audio-stage" class="audio-stage" hidden>
        <div class="audio-cover">♪</div>
        <div class="audio-meta">
          <div class="audio-title" id="audio-title"></div>
          <div id="audio-player-slot" class="audio-player-slot"></div>
        </div>
      </div>
      <div id="player-error" class="player-error" hidden></div>
    </div>

    <section class="control-panel" aria-label="學習控制列">
      <!-- 字幕（來自詞匯 JSON 的 englishSentence / chineseTranslation） -->
      <div class="subtitle-bar" id="subtitle-bar" hidden>
        <div class="subtitle-text" id="subtitle-text">
          <div class="subtitle-en" id="subtitle-en"></div>
          <div class="subtitle-zh" id="subtitle-zh"></div>
        </div>
        <div class="subtitle-size">
          <button class="mini-btn" type="button" id="btn-sub-smaller" title="縮小字幕">A−</button>
          <button class="mini-btn" type="button" id="btn-sub-larger" title="放大字幕">A＋</button>
        </div>
        <div class="subtitle-resize" id="subtitle-resize" title="上下拖曳調整字幕高度"></div>
      </div>

      <!-- A-B 時間軸 -->
      <div class="ab-timeline" id="ab-timeline">
        <div class="ab-track" id="ab-track">
          <div class="ab-range" id="ab-range"></div>
          <div class="ab-playhead" id="ab-playhead" title="目前播放位置"></div>
          <div class="ab-handle ab-handle-a" id="ab-handle-a" title="拖曳調整 A 點"></div>
          <div class="ab-handle ab-handle-b" id="ab-handle-b" title="拖曳調整 B 點"></div>
        </div>
      </div>

      <div class="control-bar">
        <div class="cb-left">
          <button class="loop-pill" id="btn-loop" title="Alt+A 切換 A-B 循環">
            <span class="loop-dot" id="loop-dot"></span>
            <span id="loop-text">A-B Off</span>
          </button>
          <span class="now-time mono" id="txt-now">00:00.0</span>
          <span class="time-sep">/</span>
          <span class="dur-time mono" id="txt-dur">00:00.0</span>
        </div>

        <div class="cb-center">
          <span class="anchor mono clickable" id="txt-a" title="滑過變黃；點擊從 A 點重播">00:00.0</span>
          <span class="anchor-sep">—</span>
          <span class="anchor mono clickable" id="txt-b" title="點擊：將目前時間設為 B 點">00:00.0</span>
          <span class="divider"></span>
          <button class="mini-btn" id="btn-nudge-a" title="A 點 -1 秒">-1s</button>
          <button class="mini-btn" id="btn-nudge-b" title="B 點 +1 秒">+1s</button>
        </div>

        <div class="cb-right">
          <label class="speed-wrap">
            <span class="speed-label">速度</span>
            <select id="speed-select" class="speed-select">
              <option value="0.5">0.5x</option>
              <option value="0.75">0.75x</option>
              <option value="0.85">0.85x</option>
              <option value="1" selected>1.0x</option>
              <option value="1.25">1.25x</option>
            </select>
          </label>
        </div>
      </div>
    </section>

    <div class="watch-only-note" id="watch-only-note" hidden>此來源僅供觀看，不支援 A-B 循環、字幕與詞匯同步。</div>

    </div>

    <aside class="player-side" aria-label="詞匯">
    <section class="vocab-panel">
      <div class="vocab-head">
        <span>詞匯（依片段）</span>
        <label class="offset-wrap" title="詞匯校時（秒）：正值＝詞匯延後出現，負值＝提早">
          <span class="offset-label">校時</span>
          <input id="sub-offset" class="sub-offset" type="number" step="0.1" value="0" inputmode="decimal">
        </label>
      </div>
      <div class="seg-nav">
        <button class="mini-btn" id="btn-prev-seg" title="上一段">‹ 上一段</button>
        <span class="seg-label mono" id="seg-label">--:-- – --:--</span>
        <button class="mini-btn" id="btn-next-seg" title="下一段">下一段 ›</button>
        <button class="mini-btn on" id="btn-follow" title="跟隨播放自動切換片段（可鎖定）">自動跟隨</button>
      </div>
      <div class="pinned-word" id="pinned-word"><span class="pinned-placeholder">點下方詞匯，這裡會顯示中文解釋</span></div>
      <div class="vocab-search-wrap">
        <input id="vocab-search" class="sub-filter" type="search" placeholder="搜尋詞匯（按 Enter 跳到該段）…" autocomplete="off">
      </div>
      <div id="vocab-list" class="vocab-list"></div>
    </section>
    </aside>
   </div>
  </main>

  <div id="osd" class="osd" aria-live="assertive"></div>

  <script src="js/player-adapters.js"></script>
  <script src="js/vocab.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
