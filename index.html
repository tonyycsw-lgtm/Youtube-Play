<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>影片學習站</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-home">
  <header class="site-header">
    <div class="container home-header-inner">
      <div class="brand">
        <div class="brand-logo">YT</div>
        <div>
          <h1 id="site-name">影片學習站</h1>
          <p class="brand-sub">點選節目，開始 A-B 循環學習</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="tool-btn add-btn" id="btn-add-video" type="button" title="新增影片（貼 YouTube 連結或上載詞匯 JSON）">＋ 新增影片</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="program-grid" class="program-grid" aria-label="節目列表">
      <div class="loading-hint" id="loading-hint">載入節目清單中…</div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>老師可用右上角「＋ 新增影片」加入節目（YouTube 連結或詞匯 JSON），或於 <code>programs.json</code> 編輯內建清單；詳見 README.md。</p>
    </div>
  </footer>

  <div class="modal" id="add-modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="add-modal-title">
      <div class="modal-head">
        <h2 id="add-modal-title">新增影片</h2>
        <button class="modal-x" type="button" data-close aria-label="關閉">×</button>
      </div>

      <div class="modal-tabs">
        <button class="modal-tab on" type="button" data-tab="link">YouTube 連結</button>
        <button class="modal-tab" type="button" data-tab="json">上載 JSON</button>
      </div>

      <form id="add-form">
        <div class="tab-pane" data-pane="link">
          <label class="field">
            <span class="field-label">影片／音頻連結</span>
            <input id="add-url" type="text" placeholder="https://youtu.be/… 或 https://…/video.mp4 或 TikTok 連結" autocomplete="off">
          </label>
          <p class="field-hint">支援 YouTube、TikTok、直接媒體檔（mp4/mp3/webm…）；貼上後會自動判斷來源並抓標題。</p>
        </div>

        <div class="tab-pane" data-pane="json" hidden>
          <label class="field">
            <span class="field-label">詞匯 JSON 檔</span>
            <input id="add-json-file" type="file" accept=".json,application/json">
          </label>
          <p class="field-hint" id="json-hint">會自動讀取影片網址與標題；支援 segments 與 wordSegments 兩種詞匯格式。</p>
        </div>

        <label class="field">
          <span class="field-label">標題</span>
          <input id="add-title" type="text" placeholder="影片標題" autocomplete="off">
        </label>

        <div class="field-row">
          <label class="field">
            <span class="field-label">語言代碼</span>
            <input id="add-lang" type="text" value="en" placeholder="en" autocomplete="off">
          </label>
        </div>

        <label class="field">
          <span class="field-label">說明（選填）</span>
          <textarea id="add-desc" rows="2" placeholder="顯示在卡片上的說明文字"></textarea>
        </label>

        <div class="modal-msg" id="add-msg" hidden></div>

        <div class="modal-actions">
          <button type="button" class="mini-btn" data-close>取消</button>
          <button type="submit" class="mini-btn strong" id="add-submit">新增</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/programs.js"></script>
  <script src="js/add-video.js"></script>
</body>
</html>
